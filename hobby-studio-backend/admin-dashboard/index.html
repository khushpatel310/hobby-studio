<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hobby Studio — Admin Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d0b08;
      color: #f0e9da;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }
    .login-wrap {
      width: 100%; max-width: 420px; padding: 40px 32px;
      background: #1a1712; border: 1px solid rgba(240,233,218,0.1);
      border-radius: 20px;
    }
    .login-wrap h1 {
      font-family: 'Georgia', serif; font-size: 1.8rem; text-align: center;
      margin-bottom: 4px;
    }
    .login-wrap h1 em { color: #d4a84b; font-style: italic; }
    .login-wrap .sub {
      text-align: center; color: #7a7268; font-size: 0.85rem; margin-bottom: 32px;
    }
    .field { margin-bottom: 20px; }
    .field label {
      display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.12em;
      color: #7a7268; margin-bottom: 8px;
    }
    .field input {
      width: 100%; padding: 12px 16px; background: rgba(255,255,255,0.03);
      border: 1px solid rgba(240,233,218,0.15); border-radius: 8px;
      color: #f0e9da; font-size: 0.95rem; transition: border-color 0.3s;
    }
    .field input:focus { outline: none; border-color: #d4a84b; }
    .btn {
      width: 100%; padding: 14px; border: 1px solid #d4a84b;
      background: #d4a84b; color: #0d0b08; font-size: 0.9rem;
      font-weight: 600; cursor: pointer; border-radius: 8px;
      transition: background 0.3s;
    }
    .btn:hover { background: #e8c876; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .error { color: #e86868; font-size: 0.85rem; margin-top: 12px; text-align: center; display: none; }
    .error.show { display: block; }
    .loading { text-align: center; margin-top: 16px; display: none; }
    .loading.show { display: block; }
    .loading::after { content: 'Authenticating...'; color: #7a7268; font-size: 0.85rem; }
    .brand-icon {
      text-align: center; margin-bottom: 20px; font-size: 2.5rem;
    }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="brand-icon">📸</div>
    <h1>Hobby <em>Studio</em></h1>
    <p class="sub">Admin Panel</p>
    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="admin@hobbystudio.com" required autocomplete="email">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn" id="loginBtn">Sign In</button>
    </form>
    <div class="error" id="errorMsg"></div>
    <div class="loading" id="loading"></div>
  </div>
  <script>
    const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.protocol === 'file:';
    const API_HOST = isLocal && window.location.port !== '5000' ? 'http://localhost:5000' : '';

    // If already logged in, go straight to dashboard
    if (localStorage.getItem('token')) {
      window.location.href = 'dashboard.html';
    }

    document.getElementById("loginForm").addEventListener("submit", async function(e) {
      e.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const btn = document.getElementById("loginBtn");
      const loading = document.getElementById("loading");
      const error = document.getElementById("errorMsg");

      error.classList.remove("show");
      loading.classList.add("show");
      btn.disabled = true;

      try {
        const response = await fetch(`${API_HOST}/api/auth/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json().catch(() => ({}));

        loading.classList.remove("show");
        btn.disabled = false;

        if (!response.ok) {
          error.innerText = data.error || "Login Failed. Please check your credentials.";
          error.classList.add("show");
          return;
        }

        // Save JWT & Admin Info
        localStorage.setItem("token", data.token);
        localStorage.setItem("admin", JSON.stringify(data.admin));

        // Relative redirect to dashboard
        window.location.href = "dashboard.html";

      } catch (err) {
        loading.classList.remove("show");
        btn.disabled = false;
        error.innerText = (err.message && err.message.includes('Failed to fetch') && isLocal)
          ? 'Could not connect to backend server. Make sure "node server.js" is running at http://localhost:5000.'
          : err.message;
        error.classList.add("show");
      }
    });
  </script>
</body>
</html>
